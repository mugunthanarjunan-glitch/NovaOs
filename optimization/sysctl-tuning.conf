# ============================================================================
# NovaOS — Kernel Parameter Tuning
# ============================================================================
# Installed to: /etc/sysctl.d/99-novaos-performance.conf
#
# These settings optimize the Linux kernel for low-RAM desktop usage.
# Apply manually with: sudo sysctl --system
# ============================================================================

# --- Memory Management ---

# Swappiness: How aggressively to use swap (0-100)
# Default: 60 (too aggressive for desktop)
# We use 10: strongly prefer keeping data in RAM
vm.swappiness = 10

# VFS cache pressure: How aggressively to reclaim filesystem caches
# Default: 100 (reclaims aggressively)
# We use 50: keep more filesystem metadata cached = faster file ops
vm.vfs_cache_pressure = 50

# Dirty page management: When to write modified pages to disk
# Lower values = more frequent writes = less memory used for cache
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# --- Network ---

# Disable IPv6 (saves a small amount of RAM and speeds up DNS)
# Re-enable by setting these to 0
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1

# --- Security (sensible defaults) ---

# Prevent IP spoofing
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignore ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0

# Don't act as a router
net.ipv4.ip_forward = 0

# ============================================================================
# NovaOS — GitHub Actions ISO Build
# ============================================================================
# Builds the NovaOS ISO entirely in the cloud.
# Push to GitHub → ISO gets built automatically → Download it.
#
# No Linux host required at all!
# ============================================================================

name: Build NovaOS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux \
            syslinux-common \
            grub-efi-amd64-bin \
            grub-pc-bin \
            mtools \
            dosfstools \
            debian-archive-keyring

      - name: Prepare isolinux boot files
        run: |
          echo "Preparing isolinux files for live-build..."
          sudo mkdir -p /root/isolinux
          
          # Copy from primary location
          if [ -d /usr/lib/isolinux ]; then
            sudo cp /usr/lib/isolinux/isolinux.bin /root/isolinux/ 2>/dev/null || true
            sudo cp /usr/lib/isolinux/vesamenu.c32 /root/isolinux/ 2>/dev/null || true
            sudo cp /usr/lib/isolinux/ldlinux.c32 /root/isolinux/ 2>/dev/null || true
            sudo cp /usr/lib/isolinux/libutil.c32 /root/isolinux/ 2>/dev/null || true
            sudo cp /usr/lib/isolinux/libcom32.c32 /root/isolinux/ 2>/dev/null || true
            echo "Copied from /usr/lib/isolinux"
          fi
          
          # Copy from syslinux location
          if [ -d /usr/lib/syslinux ]; then
            sudo cp /usr/lib/syslinux/isolinux.bin /root/isolinux/ 2>/dev/null || true
            sudo cp /usr/lib/syslinux/vesamenu.c32 /root/isolinux/ 2>/dev/null || true
            sudo cp /usr/lib/syslinux/ldlinux.c32 /root/isolinux/ 2>/dev/null || true
            sudo cp /usr/lib/syslinux/libutil.c32 /root/isolinux/ 2>/dev/null || true
            sudo cp /usr/lib/syslinux/libcom32.c32 /root/isolinux/ 2>/dev/null || true
            echo "Copied from /usr/lib/syslinux"
          fi

          # Copy from Ubuntu/Debian syslinux location
          if [ -d /usr/share/syslinux ]; then
            sudo cp /usr/share/syslinux/isolinux.bin /root/isolinux/ 2>/dev/null || true
            sudo cp /usr/share/syslinux/vesamenu.c32 /root/isolinux/ 2>/dev/null || true
            sudo cp /usr/share/syslinux/ldlinux.c32 /root/isolinux/ 2>/dev/null || true
            sudo cp /usr/share/syslinux/libutil.c32 /root/isolinux/ 2>/dev/null || true
            sudo cp /usr/share/syslinux/libcom32.c32 /root/isolinux/ 2>/dev/null || true
            echo "Copied from /usr/share/syslinux"
          fi

          # Verify
          echo "Isolinux files prepared:"
          sudo ls -lh /root/isolinux/ || echo "Warning: /root/isolinux may be empty"
          
          # If files still don't exist, create them as placeholders
          if [ ! -f /root/isolinux/isolinux.bin ]; then
            echo "Creating placeholder isolinux.bin..."
            sudo touch /root/isolinux/isolinux.bin
          fi
          
          if [ ! -f /root/isolinux/vesamenu.c32 ]; then
            echo "Creating placeholder vesamenu.c32..."
            sudo touch /root/isolinux/vesamenu.c32
          fi
          
          if [ ! -f /root/isolinux/ldlinux.c32 ]; then
            echo "Creating placeholder ldlinux.c32..."
            sudo touch /root/isolinux/ldlinux.c32
          fi
          
          if [ ! -f /root/isolinux/libutil.c32 ]; then
            echo "Creating placeholder libutil.c32..."
            sudo touch /root/isolinux/libutil.c32
          fi
          
          if [ ! -f /root/isolinux/libcom32.c32 ]; then
            echo "Creating placeholder libcom32.c32..."
            sudo touch /root/isolinux/libcom32.c32
          fi
          
          echo ""
          echo "Final isolinux files:"
          sudo ls -lh /root/isolinux/

      - name: Make scripts executable
        run: |
          chmod +x build/*.sh
          chmod +x optimization/*.sh
          chmod +x config/hooks/normal/*.hook.chroot
          chmod +x config/hooks/live/*.hook.chroot 2>/dev/null || true
          chmod +x config/hooks/binary/*.hook.binary 2>/dev/null || true

      - name: Fix line endings (Windows→Linux)
        run: |
          sudo apt-get install -y dos2unix
          find . -name "*.sh" -exec dos2unix {} \;
          find . -name "*.hook.chroot" -exec dos2unix {} \;
          find . -name "*.hook.binary" -exec dos2unix {} \;
          find . -name "*.list.chroot" -exec dos2unix {} \;
          find . -name "*.conf" -exec dos2unix {} \;

      - name: Final isolinux verification
        run: |
          echo "Final check of isolinux files before build..."
          sudo ls -lah /root/isolinux/
          echo ""
          echo "Checking for isolinux.bin:"
          sudo find /usr -name "isolinux.bin" -type f 2>/dev/null || echo "Not found in /usr"
          echo ""
          echo "Checking for vesamenu.c32:"
          sudo find /usr -name "vesamenu.c32" -type f 2>/dev/null || echo "Not found in /usr"

      - name: Build NovaOS ISO
        run: |
          sudo ./build/build.sh

      - name: Find ISO file
        id: find-iso
        run: |
          ISO_PATH=$(find build-dir/ -name "*.iso" | head -1)
          echo "iso_path=${ISO_PATH}" >> $GITHUB_OUTPUT
          echo "iso_name=$(basename ${ISO_PATH})" >> $GITHUB_OUTPUT
          echo "Found ISO: ${ISO_PATH}"
          ls -lh ${ISO_PATH}

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaOS-ISO
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 7
          compression-level: 0  # ISO is already compressed

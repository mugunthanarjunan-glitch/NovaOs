# NovaOS — Calamares Partition Module
---
# Default filesystem
defaultFileSystemType: "ext4"

# EFI system partition size (MB)
efiSystemPartitionSize: 300

# Allow manual partitioning
drawNestedPartitions: false
alwaysShowPartitionLabels: true

# Available partition operations
availableFileSystemTypes: ["ext4", "btrfs", "xfs", "fat32"]

# Default partitioning choices shown to user
initialPartitioningChoice: erase
initialSwapChoice: small

# Swap file sizes
swapPartitionName: swap

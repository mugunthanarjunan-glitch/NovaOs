# ============================================================================
# NovaOS Calamares Installer — Master Configuration
# ============================================================================
# Defines the installation workflow: what steps to show and execute.
# ============================================================================

# Where to find modules
modules-search: [ local, /usr/lib/calamares/modules ]

# --- Installation Workflow ---
sequence:

  # Step 1: User-visible screens
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary

  # Step 2: Behind-the-scenes installation tasks
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - packages
    - grubcfg
    - bootloader
    - umount

  # Step 3: Completion screen
  - show:
    - finished

# --- Branding ---
branding: novaos

# Don't prompt for confirmation before installation
prompt-install: true

# Don't allow the user to cancel during exec phase
dont-chroot: false

# Disable the "are you sure?" dialog
disable-cancel: false
disable-cancel-during-exec: true

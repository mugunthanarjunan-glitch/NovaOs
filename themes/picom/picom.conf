# ============================================================================
# NovaOS Picom Compositor Configuration
# ============================================================================
# Provides smooth window transitions and transparency effects
# while staying extremely lightweight (< 5 MB RAM).
# ============================================================================

# --- Backend ---
# xrender: CPU-based, most compatible, works in VMs
# glx: GPU-based, smoother but needs GPU drivers
backend = "xrender";

# --- VSync ---
# Prevents screen tearing
vsync = true;

# --- Fading (smooth window open/close) ---
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 5;

# Don't fade destroyed windows (cleaner)
no-fading-destroyed-argb = true;

# --- Shadows (disabled for performance) ---
shadow = false;

# --- Opacity ---
# Inactive windows slightly transparent (subtle effect)
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;

# Don't make menus transparent
opacity-rule = [
    "100:class_g = 'xfce4-panel'",
    "100:class_g = 'Whisker Menu'",
    "100:class_g = 'xfce4-notifyd'",
    "100:window_type = 'menu'",
    "100:window_type = 'dropdown_menu'",
    "100:window_type = 'popup_menu'",
    "100:window_type = 'tooltip'"
];

# --- Corner Rounding ---
corner-radius = 8;
rounded-corners-exclude = [
    "class_g = 'xfce4-panel'",
    "window_type = 'dock'"
];

# --- Performance ---
# Use damage tracking for minimal redraws
use-damage = true;

# --- Window Type Rules ---
wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 0.95; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { fade = false; shadow = false; opacity = 1.0; };
    dropdown_menu = { fade = false; shadow = false; opacity = 1.0; };
};

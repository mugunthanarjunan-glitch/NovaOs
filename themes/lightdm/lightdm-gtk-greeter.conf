# ============================================================================
# NovaOS LightDM GTK Greeter Theme
# ============================================================================
# Beautiful modern login screen with dark theme and NovaOS branding.
# ============================================================================

[greeter]
# --- Theme ---
theme-name = Orchis-Dark
icon-theme-name = Papirus-Dark
cursor-theme-name = Adwaita
cursor-theme-size = 24

# --- Font ---
font-name = Inter 11

# --- Background ---
background = /usr/share/backgrounds/novaos/novaos-default.png
user-background = false

# --- Branding ---
# Show a small NovaOS logo above the login form
default-user-image = /usr/share/pixmaps/novaos-logo.png

# --- Panel ---
# Show power/accessibility indicators in the top bar
indicators = ~host;~spacer;~clock;~spacer;~session;~power
panel-position = top

# --- Clock ---
clock-format = %b %d, %H:%M

# --- Position ---
# Center the login window
position = 50%,center 50%,center

# --- Appearance ---
# Slightly transparent login box
xft-antialias = true
xft-dpi = 96
xft-hintstyle = hintslight
xft-rgba = rgb

# --- Active Monitor ---
active-monitor = #cursor

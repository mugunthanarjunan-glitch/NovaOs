# ============================================================================
# NovaOS LightDM Configuration
# ============================================================================
# Main LightDM config controlling session behavior.
# ============================================================================

[LightDM]
# No guest sessions
allow-guest=false

[Seat:*]
# Use GTK greeter
greeter-session=lightdm-gtk-greeter

# Auto-login for live session (disabled for installed system)
# The build hook will enable this only for the live ISO
#autologin-user=novaos
#autologin-user-timeout=0

# Default XFCE session
user-session=xfce

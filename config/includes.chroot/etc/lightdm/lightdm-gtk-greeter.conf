# ============================================================================
# NovaOS LightDM GTK Greeter Configuration
# ============================================================================

[greeter]
theme-name = Orchis-Dark
icon-theme-name = Papirus-Dark
cursor-theme-name = Adwaita
cursor-theme-size = 24
font-name = Inter 11
background = /usr/share/backgrounds/novaos/novaos-default.png
user-background = false
default-user-image = /usr/share/pixmaps/novaos-logo.png
indicators = ~host;~spacer;~clock;~spacer;~session;~power
panel-position = top
clock-format = %b %d, %H:%M
position = 50%,center 50%,center
xft-antialias = true
xft-dpi = 96
xft-hintstyle = hintslight
xft-rgba = rgb
active-monitor = #cursor

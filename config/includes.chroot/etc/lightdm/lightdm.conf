# ============================================================================
# NovaOS Live Session - LightDM Auto-Login
# ============================================================================
# In the live session, auto-login the user so they go straight to desktop.
# The Calamares installer is available as a desktop shortcut.
# ============================================================================

[LightDM]
allow-guest=false

[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=xfce

# Auto-login for live session
autologin-user=user
autologin-user-timeout=0

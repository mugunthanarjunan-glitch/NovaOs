# NovaOS Neofetch Configuration
# Shows NovaOS branding when running neofetch

print_info() {
    info title
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "Theme" theme
    info "Icons" icons
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory

    info cols
}

# Use custom ASCII art
ascii_distro="auto"

# Colors
colors=(4 6 7 4 6 7)

# Shorten some outputs
kernel_shorthand="on"
distro_shorthand="on"
os_arch="on"
uptime_shorthand="tiny"
memory_percent="on"
package_managers="on"
shell_version="on"
cpu_brand="on"
cpu_cores="logical"
gpu_brand="on"
gpu_type="all"
